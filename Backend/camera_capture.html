<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance System - Camera Capture</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: center;
        }

        .tab {
            padding: 15px 30px;
            background: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .tab.active {
            background: #ffd700;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.2);
        }

        .tab:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.2);
        }

        .content {
            display: none;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .content.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }

        input[type="text"],
        input[type="email"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        input[type="email"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .camera-container {
            position: relative;
            width: 100%;
            max-width: 640px;
            margin: 20px auto;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
        }

        #video, #capturedImage {
            width: 100%;
            display: block;
        }

        #capturedImage {
            display: none;
        }

        .camera-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-capture {
            background: #667eea;
            color: white;
        }

        .btn-capture:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }

        .btn-retake {
            background: #ff6b6b;
            color: white;
        }

        .btn-retake:hover {
            background: #ee5a52;
            transform: translateY(-2px);
        }

        .btn-submit {
            background: #51cf66;
            color: white;
            width: 100%;
            padding: 15px;
            font-size: 18px;
            margin-top: 20px;
        }

        .btn-submit:hover {
            background: #40c057;
            transform: translateY(-2px);
        }

        .btn-submit:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            font-weight: bold;
            display: none;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        .loading {
            text-align: center;
            color: #667eea;
            font-weight: bold;
            display: none;
        }

        .loading.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📸 Attendance System</h1>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('register')">Register Employee</button>
            <button class="tab" onclick="switchTab('attendance')">Mark Attendance</button>
        </div>

        <!-- Registration Form -->
        <div id="register" class="content active">
            <h2 style="margin-bottom: 20px;">Employee Registration</h2>
            <form id="registerForm">
                <div class="form-group">
                    <label for="regName">Full Name *</label>
                    <input type="text" id="regName" required placeholder="Enter employee name">
                </div>

                <div class="form-group">
                    <label for="regDesignation">Designation *</label>
                    <input type="text" id="regDesignation" required placeholder="e.g., Software Engineer">
                </div>

                <div class="form-group">
                    <label for="regEmail">Email (Optional)</label>
                    <input type="email" id="regEmail" placeholder="employee@example.com">
                </div>

                <div class="form-group">
                    <label>Capture Your Photo *</label>
                    <div class="camera-container">
                        <video id="regVideo" autoplay playsinline></video>
                        <canvas id="regCanvas" style="display:none;"></canvas>
                        <img id="regCapturedImage" alt="Captured">
                    </div>

                    <div class="camera-buttons">
                        <button type="button" class="btn-capture" id="regCaptureBtn" onclick="captureImage('reg')">
                            📷 Capture Photo
                        </button>
                        <button type="button" class="btn-retake" id="regRetakeBtn" onclick="retakeImage('reg')" style="display:none;">
                            🔄 Retake Photo
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-submit" id="regSubmitBtn" disabled>
                    Register Employee
                </button>

                <div class="loading" id="regLoading">Processing...</div>
                <div class="message" id="regMessage"></div>
            </form>
        </div>

        <!-- Attendance Form -->
        <div id="attendance" class="content">
            <h2 style="margin-bottom: 20px;">Mark Attendance</h2>
            <form id="attendanceForm">
                <div class="form-group">
                    <label>Capture Your Photo for Attendance *</label>
                    <div class="camera-container">
                        <video id="attVideo" autoplay playsinline></video>
                        <canvas id="attCanvas" style="display:none;"></canvas>
                        <img id="attCapturedImage" alt="Captured">
                    </div>

                    <div class="camera-buttons">
                        <button type="button" class="btn-capture" id="attCaptureBtn" onclick="captureImage('att')">
                            📷 Capture Photo
                        </button>
                        <button type="button" class="btn-retake" id="attRetakeBtn" onclick="retakeImage('att')" style="display:none;">
                            🔄 Retake Photo
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-submit" id="attSubmitBtn" disabled>
                    Mark Attendance
                </button>

                <div class="loading" id="attLoading">Processing...</div>
                <div class="message" id="attMessage"></div>
            </form>
        </div>
    </div>

    <script>
        const API_URL = 'http://127.0.0.1:8000';
        let streams = { reg: null, att: null };
        let capturedImages = { reg: null, att: null };

        // Initialize cameras
        async function initCamera(type) {
            try {
                const video = document.getElementById(`${type}Video`);
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { width: 640, height: 480, facingMode: 'user' } 
                });
                video.srcObject = stream;
                streams[type] = stream;
            } catch (err) {
                showMessage(type, 'Error accessing camera: ' + err.message, 'error');
            }
        }

        // Capture image
        function captureImage(type) {
            const video = document.getElementById(`${type}Video`);
            const canvas = document.getElementById(`${type}Canvas`);
            const capturedImage = document.getElementById(`${type}CapturedImage`);
            const captureBtn = document.getElementById(`${type}CaptureBtn`);
            const retakeBtn = document.getElementById(`${type}RetakeBtn`);
            const submitBtn = document.getElementById(`${type}SubmitBtn`);

            // Set canvas dimensions to match video
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;

            // Draw video frame to canvas
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0);

            // Convert to base64
            const base64Image = canvas.toDataURL('image/jpeg', 0.8);
            capturedImages[type] = base64Image;

            // Show captured image
            capturedImage.src = base64Image;
            capturedImage.style.display = 'block';
            video.style.display = 'none';

            // Update buttons
            captureBtn.style.display = 'none';
            retakeBtn.style.display = 'inline-block';
            submitBtn.disabled = false;

            // Stop camera
            stopCamera(type);
        }

        // Retake image
        function retakeImage(type) {
            const video = document.getElementById(`${type}Video`);
            const capturedImage = document.getElementById(`${type}CapturedImage`);
            const captureBtn = document.getElementById(`${type}CaptureBtn`);
            const retakeBtn = document.getElementById(`${type}RetakeBtn`);
            const submitBtn = document.getElementById(`${type}SubmitBtn`);

            // Show video again
            capturedImage.style.display = 'none';
            video.style.display = 'block';

            // Update buttons
            captureBtn.style.display = 'inline-block';
            retakeBtn.style.display = 'none';
            submitBtn.disabled = true;

            capturedImages[type] = null;

            // Restart camera
            initCamera(type);
        }

        // Stop camera
        function stopCamera(type) {
            if (streams[type]) {
                streams[type].getTracks().forEach(track => track.stop());
                streams[type] = null;
            }
        }

        // Switch tabs
        function switchTab(tab) {
            // Update tab buttons
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');

            // Update content
            document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
            document.getElementById(tab).classList.add('active');

            // Stop other camera and initialize current tab camera
            const otherType = tab === 'register' ? 'att' : 'reg';
            stopCamera(otherType);
            
            if (!capturedImages[tab]) {
                initCamera(tab);
            }
        }

        // Show message
        function showMessage(type, message, messageType) {
            const messageEl = document.getElementById(`${type}Message`);
            messageEl.textContent = message;
            messageEl.className = `message ${messageType}`;
            setTimeout(() => {
                messageEl.className = 'message';
            }, 5000);
        }

        // Helper function to convert base64 to Blob
        function base64ToBlob(base64Data) {
            const arr = base64Data.split(',');
            const mime = arr[0].match(/:(.*?);/)[1];
            const bstr = atob(arr[1]);
            let n = bstr.length;
            const u8arr = new Uint8Array(n);
            while(n--) {
                u8arr[n] = bstr.charCodeAt(n);
            }
            return new Blob([u8arr], { type: mime });
        }

        // Registration form submit
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = document.getElementById('regName').value;
            const designation = document.getElementById('regDesignation').value;
            const email = document.getElementById('regEmail').value;
            const base64Image = capturedImages.reg;

            if (!base64Image) {
                showMessage('reg', 'Please capture your photo first', 'error');
                return;
            }

            const loading = document.getElementById('regLoading');
            const submitBtn = document.getElementById('regSubmitBtn');

            loading.classList.add('show');
            submitBtn.disabled = true;

            try {
                // Validate fields
                if (!name.trim()) {
                    showMessage('reg', '❌ Please enter employee name', 'error');
                    loading.classList.remove('show');
                    submitBtn.disabled = false;
                    return;
                }
                if (!designation.trim()) {
                    showMessage('reg', '❌ Please enter designation', 'error');
                    loading.classList.remove('show');
                    submitBtn.disabled = false;
                    return;
                }

                // Convert base64 to Blob
                const imageBlob = base64ToBlob(base64Image);
                console.log('Image blob size:', imageBlob.size, 'Type:', imageBlob.type);

                // Create FormData
                const formData = new FormData();
                formData.append('name', name);
                formData.append('designation', designation);
                if (email && email.trim()) {
                    formData.append('email', email);
                }
                formData.append('image', imageBlob, 'photo.jpg');

                console.log('Sending registration data...');
                const response = await fetch(`${API_URL}/register`, {
                    method: 'POST',
                    body: formData
                });

                console.log('Response status:', response.status);
                let data;
                try {
                    data = await response.json();
                } catch (parseErr) {
                    console.error('Failed to parse response:', parseErr);
                    data = { detail: 'Invalid response from server' };
                }
                console.log('Response data:', data);

                if (response.ok) {
                    showMessage('reg', `✅ Success! Employee registered. User ID: ${data.user_id}`, 'success');
                    document.getElementById('registerForm').reset();
                    retakeImage('reg');
                } else {
                    const errorMsg = data.detail || `HTTP ${response.status}: ${JSON.stringify(data)}`;
                    console.error('Registration error:', errorMsg);
                    showMessage('reg', `❌ Error: ${errorMsg}`, 'error');
                }
            } catch (err) {
                console.error('Network error:', err);
                showMessage('reg', '❌ Network error: ' + err.message, 'error');
            } finally {
                loading.classList.remove('show');
                submitBtn.disabled = false;
            }
        });

        // Attendance form submit
        document.getElementById('attendanceForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const base64Image = capturedImages.att;

            if (!base64Image) {
                showMessage('att', 'Please capture your photo first', 'error');
                return;
            }

            const loading = document.getElementById('attLoading');
            const submitBtn = document.getElementById('attSubmitBtn');

            loading.classList.add('show');
            submitBtn.disabled = true;

            try {
                // Convert base64 to Blob
                const imageBlob = base64ToBlob(base64Image);
                console.log('Image blob size:', imageBlob.size, 'Type:', imageBlob.type);

                // Create FormData
                const formData = new FormData();
                formData.append('image', imageBlob, 'photo.jpg');

                console.log('Sending attendance data...');
                const response = await fetch(`${API_URL}/face-attendance`, {
                    method: 'POST',
                    body: formData
                });

                console.log('Response status:', response.status);
                let data;
                try {
                    data = await response.json();
                } catch (parseErr) {
                    console.error('Failed to parse response:', parseErr);
                    data = { detail: 'Invalid response from server' };
                }
                console.log('Response data:', data);

                if (response.ok) {
                    const icon = data.attendance_type === 'LOGIN' ? '👋' : '👋';
                    showMessage('att', `${icon} ${data.message}`, 'success');
                    retakeImage('att');
                } else {
                    const errorMsg = data.detail || `HTTP ${response.status}: ${JSON.stringify(data)}`;
                    console.error('Attendance error:', errorMsg);
                    showMessage('att', `❌ Error: ${errorMsg}`, 'error');
                }
            } catch (err) {
                console.error('Network error:', err);
                showMessage('att', '❌ Network error: ' + err.message, 'error');
            } finally {
                loading.classList.remove('show');
                submitBtn.disabled = false;
            }
        });

        // Initialize first tab camera on page load
        window.addEventListener('load', () => {
            initCamera('reg');
        });

        // Stop cameras when page is closed
        window.addEventListener('beforeunload', () => {
            stopCamera('reg');
            stopCamera('att');
        });
    </script>
</body>
</html>
