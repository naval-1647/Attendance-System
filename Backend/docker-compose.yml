version: '3.8'

services:
  attendance-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: attendance_system_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=True
    volumes:
      - ./:/app
    restart: unless-stopped
    networks:
      - attendance_network

networks:
  attendance_network:
    driver: bridge

# To run:
# docker-compose up --build
#
# To check logs:
# docker-compose logs -f attendance-api
#
# To stop:
# docker-compose down
#
# Access API at: http://localhost:8000
# API Docs: http://localhost:8000/docs
