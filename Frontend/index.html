<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face Recognition Attendance System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100">
    <div id="root" class="min-h-screen flex items-center justify-center">
        <div class="container mx-auto px-4">
            <div class="max-w-lg mx-auto bg-white rounded-lg shadow-lg p-8">
            <h1 class="text-3xl font-bold text-center mb-8 text-blue-600">
                Attendance System
            </h1>
            
            <div class="space-y-4">
                <a href="http://localhost:8000/upload" class="block w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 px-4 rounded text-center transition">
                    📸 Register Face
                </a>
                
                <a href="http://localhost:8000/camera" class="block w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-4 rounded text-center transition">
                    ✓ Mark Attendance
                </a>

                <a href="http://localhost:8000/attendance-report" class="block w-full bg-indigo-500 hover:bg-indigo-600 text-white font-bold py-3 px-4 rounded text-center transition">
                    📊 View Daily Report
                </a>
                
                <a href="http://localhost:8000/docs" class="block w-full bg-purple-500 hover:bg-purple-600 text-white font-bold py-3 px-4 rounded text-center transition">
                    📚 API Docs
                </a>
            </div>
            
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
